# CI for every Margin extension. On every push and pull request it builds, tests and packages
# Margin Browser Review (browser-review/) and Margin for GitHub (github/).
#
# Releases are automatic, one for everything (scripts/release.ts): on a push to main, the Conventional
# Commits since the last vX.Y.Z tag decide the next version (feat -> minor, fix/perf -> patch, "!" ->
# major; docs, ci, chore and the like release nothing). CI writes that version into both extensions,
# commits "chore(release): vX.Y.Z", tags it, builds that commit and publishes the release "Margin X.Y.Z"
# (the repo's Latest) with the same file names every time, so releases/latest/download/<file> always
# works:
#   margin-github-firefox.xpi           margin-browser-review-firefox.xpi   signed by Mozilla, install in one click
#   margin-github-chrome.zip            margin-browser-review-chrome.zip    Chrome, Brave, Edge: Load unpacked
# The MCP server (browser-review-mcp) is built and tested here but published to npm by hand.
#
# Secrets, all optional (whatever has no keys is skipped with a notice):
#   AMO_JWT_ISSUER, AMO_JWT_SECRET   Mozilla signing. Without them the Firefox files are unsigned zips.
#   CWS_CLIENT_ID, CWS_CLIENT_SECRET, CWS_REFRESH_TOKEN + variables CWS_PUBLISHER_ID,
#     CWS_EXTENSION_ID (Margin Browser Review), CWS_GITHUB_EXTENSION_ID (Margin for GitHub)
#   NETLIFY_BUILD_HOOK               rebuilds the website after a release, so it offers the new files
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # "Run workflow" on main can force a release
    inputs:
      release:
        description: Release at least this much, even without feat or fix commits
        type: choice
        options: [none, patch, minor, major]
        default: none

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # the release commit and tag
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      ref: ${{ steps.push.outputs.ref || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags and history
          # On main: the branch as it is now, including an earlier run's release commit.
          ref: ${{ github.event_name != 'pull_request' && github.ref || '' }}

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false

      - name: Test the release script
        run: node --test scripts/release.test.ts

      - name: Plan the version
        id: plan
        env:
          FORCE_LEVEL: ${{ inputs.release }}
        run: |
          plan=$(node scripts/release.ts plan)
          echo "$plan"
          level=$(echo "$plan" | jq -r .level)
          echo "version=$(echo "$plan" | jq -r .version)" >> "$GITHUB_OUTPUT"
          if [ "$level" != none ] && [ "$GITHUB_EVENT_NAME" != pull_request ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "No release: level $level on $GITHUB_EVENT_NAME $GITHUB_REF."
          fi

      - name: Commit and tag v${{ steps.plan.outputs.version }}
        id: push
        if: steps.plan.outputs.release == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          node scripts/release.ts apply "$VERSION"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "chore(release): v$VERSION"
          git tag "v$VERSION"
          # A push with the workflow's token starts no new run, so this doesn't loop.
          git push origin HEAD:refs/heads/main "refs/tags/v$VERSION"
          echo "ref=v$VERSION" >> "$GITHUB_OUTPUT"

  browser-review:
    name: Margin Browser Review - test and package
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: browser-review
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.ref }}

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: browser-review/package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: browser-review/.nvmrc
          cache: pnpm
          cache-dependency-path: browser-review/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Package the extension (Chrome/Brave/Edge and Firefox)
        run: pnpm package

      - name: Build and test the MCP server (published to npm by hand)
        run: |
          pnpm --dir server build
          BRM_CLI=dist/cli.js node --test server/src/cli.test.ts

      - name: Check the Firefox build with Mozilla's linter
        run: npx --yes web-ext lint --source-dir extension/dist-firefox --output text

      - run: ls -l release

      - uses: actions/upload-artifact@v7
        with:
          name: browser-review
          path: browser-review/release/*
          if-no-files-found: error

  margin-github:
    name: Margin for GitHub - test and package
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: github
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.ref }}

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: github/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: github/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Package for Chrome/Brave/Edge and Firefox
        run: pnpm package

      - name: Check the Firefox build with Mozilla's linter
        run: npx --yes web-ext lint --source-dir dist-firefox --output text

      - run: ls -l release

      - uses: actions/upload-artifact@v7
        with:
          name: margin-github
          path: github/release/*
          if-no-files-found: error

  release:
    name: Release Margin ${{ needs.version.outputs.version }}
    needs: [version, browser-review, margin-github]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60 # Mozilla's automatic review usually takes minutes per add-on
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
      WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
      NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.ref }}
          fetch-depth: 0 # tags and history for the release notes

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false

      - uses: actions/download-artifact@v8
        with:
          name: browser-review
          path: built/browser-review

      - uses: actions/download-artifact@v8
        with:
          name: margin-github
          path: built/margin-github

      - name: Installers for Firefox (signed by Mozilla when the keys are set)
        id: firefox
        run: |
          mkdir -p out
          if [ -n "$WEB_EXT_API_KEY" ] && [ -n "$WEB_EXT_API_SECRET" ]; then
            # Mozilla reviews bundled code against its source: send the repo at this commit.
            # Build steps for a reviewer: in browser-review/ or github/, pnpm install, pnpm package (Node 26, pnpm).
            git archive --format=zip -o source.zip HEAD
            .github/scripts/sign-firefox.sh "built/margin-github/margin-github-$VERSION-firefox.zip" out/margin-github-firefox.xpi
            .github/scripts/sign-firefox.sh "built/browser-review/browser-review-$VERSION-firefox.zip" out/margin-browser-review-firefox.xpi
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Firefox builds are not signed, so they don't install for good. Add the AMO_JWT_ISSUER and AMO_JWT_SECRET secrets (browser-review/docs/releasing.md)."
            cp "built/margin-github/margin-github-$VERSION-firefox.zip" out/margin-github-firefox.zip
            cp "built/browser-review/browser-review-$VERSION-firefox.zip" out/margin-browser-review-firefox.zip
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Installers for Chrome, Brave, Edge
        run: |
          cp "built/margin-github/margin-github-$VERSION-chrome.zip" out/margin-github-chrome.zip
          cp "built/browser-review/browser-review-$VERSION-chrome.zip" out/margin-browser-review-chrome.zip
          ls -l out

      - name: Publish the release v${{ needs.version.outputs.version }}
        env:
          FIREFOX_SIGNED: ${{ steps.firefox.outputs.signed }}
        # Safe to rerun: it creates the release once and replaces its files.
        run: |
          . .github/scripts/retry.sh
          tag="v$VERSION"
          prev=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vx "$tag" | head -n 1)
          node scripts/release.ts notes "$VERSION" "$prev" > notes.md
          cat notes.md
          make_draft() {
            gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --draft \
              --verify-tag --title "Margin $VERSION" --notes-file notes.md
          }
          retry make_draft
          retry gh release edit "$tag" --notes-file notes.md
          retry gh release upload "$tag" out/* --clobber
          retry gh release edit "$tag" --draft=false --latest

      - name: Rebuild the website
        run: .github/scripts/netlify.sh

  chrome-web-store:
    name: Upload to the Chrome Web Store
    needs: [version, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.version.outputs.version }}
      CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
      CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
      CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
      CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
      BROWSER_REVIEW_ID: ${{ vars.CWS_EXTENSION_ID }}
      GITHUB_EXTENSION_ID: ${{ vars.CWS_GITHUB_EXTENSION_ID }}
    steps:
      - name: Skip without Chrome Web Store credentials
        if: env.CWS_REFRESH_TOKEN == ''
        run: echo "::notice::Chrome Web Store upload skipped. Add the CWS_* secrets and variables (browser-review/docs/releasing.md)."

      - uses: actions/download-artifact@v8
        if: env.CWS_REFRESH_TOKEN != ''
        with:
          path: built

      - name: Upload and submit for review
        if: env.CWS_REFRESH_TOKEN != ''
        run: |
          api="https://chromewebstore.googleapis.com"
          token=$(curl -sS --fail-with-body -X POST https://oauth2.googleapis.com/token \
            -d client_id="$CWS_CLIENT_ID" -d client_secret="$CWS_CLIENT_SECRET" \
            -d refresh_token="$CWS_REFRESH_TOKEN" -d grant_type=refresh_token | jq -r .access_token)
          echo "::add-mask::$token"
          upload() { # <store item id> <zip>
            [ -n "$1" ] || { echo "::notice::No store id for $2, skipped."; return 0; }
            item="publishers/$CWS_PUBLISHER_ID/items/$1"
            echo "Uploading $2"
            curl -sS --fail-with-body -X POST -H "Authorization: Bearer $token" -T "$2" "$api/upload/v2/$item:upload" | tee upload.json
            if grep -q IN_PROGRESS upload.json; then sleep 30; fi
            curl -sS --fail-with-body -X POST -H "Authorization: Bearer $token" "$api/v2/$item:publish"
          }
          upload "$BROWSER_REVIEW_ID" "built/browser-review/browser-review-$VERSION-chrome.zip"
          upload "$GITHUB_EXTENSION_ID" "built/margin-github/margin-github-$VERSION-chrome.zip"

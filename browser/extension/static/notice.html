<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Browser Review</title>
    <style>
      body {
        width: 320px;
        margin: 0;
        padding: 16px;
        font: 14px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        color: #1c1d21;
        background: #fff;
      }
      h1 {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 8px;
        font-size: 15px;
      }
      h1 img {
        width: 20px;
        height: 20px;
      }
      p {
        margin: 0 0 10px;
      }
      .dim {
        color: #6b6f78;
      }
      code {
        font: 12px ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        background: #f5f5f7;
        padding: 1px 4px;
        border-radius: 4px;
        word-break: break-all;
      }
      h2 {
        margin: 14px 0 6px;
        font-size: 12px;
        font-weight: 600;
        color: #6b6f78;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      button {
        display: block;
        width: 100%;
        margin: 0 0 6px;
        padding: 8px 10px;
        border: 1px solid #e3e4e8;
        border-radius: 8px;
        background: #fff;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      button:hover {
        background: #f5f5f7;
      }
      button.primary {
        background: #5b4cdb;
        border-color: #5b4cdb;
        color: #fff;
        text-align: center;
        font-weight: 500;
      }
      button.primary:hover {
        background: #4a3cc4;
      }
      button .title {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      button .url {
        display: block;
        font-size: 12px;
        color: #6b6f78;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      button.help {
        margin: 12px 0 0;
        border: 0;
        padding: 0;
        background: none;
        color: #5b4cdb;
        font-weight: 500;
        text-align: left;
      }
      button.help:hover {
        background: none;
        text-decoration: underline;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <section id="not-here" hidden>
      <h1><img src="icons/48.png" alt="" /><span id="not-here-title"></span></h1>
      <p id="not-here-text"></p>
      <p class="dim">This page is <code id="here"></code></p>
      <div id="tabs" hidden>
        <h2>Tabs where it runs</h2>
        <ul id="tab-list"></ul>
      </div>
      <p id="no-tabs" class="dim" hidden>Start your dev server and open it, for example <code>http://localhost:5173</code> or <code>https://my-app.test</code>.</p>
    </section>

    <section id="not-loaded" hidden>
      <h1><img src="icons/48.png" alt="" />Reload the page</h1>
      <p>The overlay is not loaded in this tab yet. That happens when the tab was open before the extension was installed or reloaded.</p>
      <button id="reload" class="primary">Reload this page</button>
    </section>

    <button id="help" class="help">How to use Browser Review</button>

    <script src="notice.js"></script>
  </body>
</html>
